name: Compilar Minimo APK

# Cancel obsolete builds so only the latest commit for a branch consumes CI time.
concurrency:
  group: minimo-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar pruebas instrumentadas Android
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Restaurar clave de firma estable
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 en la configuración de GitHub Actions."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Clave estable encontrada y validada."

      # Compose and repository behavior tests run under Robolectric in testDebugUnitTest.
      # Android instrumented test sources are still compiled above; launching a full emulator here
      # exceeds this runner's available disk space for userdata.img.

      - name: Compilar APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.5.${GITHUB_RUN_NUMBER}"
          echo "Building Mínimo ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          gradle :app:assembleDebug --stacktrace -PVERSION_CODE="${VERSION_CODE}" -PVERSION_NAME="${VERSION_NAME}"

      - name: Verificar firma y validez del APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK_PATH}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${APK_PATH}"
          sha256sum "${APK_PATH}"

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: minimo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
