name: Mínimo - comprobaciones de solicitudes de cambio

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "tools/**"
      - ".gitignore"
      - "SECURITY.md"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: minimo-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el proyecto sin guardar credenciales Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Escanear credenciales en archivos y en el historial
        run: python3 tools/secret_scan.py

      - name: Probar el detector de credenciales
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Preparar Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        timeout-minutes: 15
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Mostrar detalles de pruebas fallidas
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_files = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          failure_count = 0
          for report in report_files:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  failure_count += 1
                  print(f"FAILED: {case.get('classname')} > {case.get('name')}")
                  print(f"Message: {problem.get('message', '(sin mensaje)')}")
                  detail = (problem.text or "").strip()
                  if detail:
                      print(detail[-4000:])
                  print("---")
          if failure_count == 0:
              print(f"No hay fallos XML de pruebas ({len(report_files)} informes revisados).")
          else:
              print(f"Total de pruebas fallidas: {failure_count}")
          PY

      - name: Compilar pruebas instrumentadas Android
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Generar clave temporal de depuración para firmar la APK de pruebas
        shell: bash
        run: |
          set -euo pipefail
          # Esta clave solo sirve para la APK de depuración de CI y no se guarda en el repositorio.
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Compilar APK de depuración para probar Chucker (sin clave de firma de distribución)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # Version única por ejecución y reintento, siguiendo la convención de las APK verificadas.
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="1.7.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          if [ "$VERSION_CODE" -le 6296 ]; then
            echo "::error::versionCode calculado ($VERSION_CODE) no supera la versión instalada 6296."
            exit 1
          fi
          gradle :app:assembleDebug --stacktrace -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Publicar APK de depuración como artefacto descargable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minimo-debug-chucker
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
