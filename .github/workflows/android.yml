name: Compilar Minimo APK

# Cancel obsolete builds so only the latest commit for a branch consumes CI time.
concurrency:
  group: minimo-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "===== Detalle XML de las pruebas fallidas ====="
            find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -name '*.xml' -print0 | xargs -0 -r cat || true
            echo "===== Fin del detalle de pruebas ====="
            exit "$test_status"
          fi

      - name: Probar el arranque en emulador Android
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Restaurar clave de firma estable
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 en la configuración de GitHub Actions."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Clave estable encontrada y validada."

      - name: Compilar APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Keep every CI build installable over the previously installed 1.5.920.
          # The 2xxx versionCode range and 1.6.x name are intentionally newer than 1.5.x.
          VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.6.${GITHUB_RUN_NUMBER}"
          echo "Building Mínimo ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          gradle :app:assembleDebug --stacktrace -PVERSION_CODE="${VERSION_CODE}" -PVERSION_NAME="${VERSION_NAME}"

      - name: Verificar identidad, versión y firma del APK
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.6.${GITHUB_RUN_NUMBER}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.aistudio.preciominimo.esrxvt' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"

          SIGNATURE="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNATURE" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="F631A8C0A194008E77A312A78775E95837DBC66DF635EAE9B966E5C294ADD450"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "::error::La firma del APK no coincide con el certificado estable esperado."
            exit 1
          }
          echo "APK verificado: paquete, versión, firma y certificado válidos."

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: minimo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
