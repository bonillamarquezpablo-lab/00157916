name: Mínimo - comprobaciones de solicitudes de cambio y APK de prueba

on:
  workflow_dispatch:
  push:
    branches:
      - fix/archive-history-product-association-20261015
      - fix/backup-signature-compat-1.5.904
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "tools/**"
      - ".gitignore"
      - "SECURITY.md"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "tools/**"
      - ".gitignore"
      - "SECURITY.md"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: minimo-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el proyecto sin guardar credenciales Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        timeout-minutes: 15
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Analizar código y manifiesto Android
        timeout-minutes: 10
        run: gradle :app:lintDebug --stacktrace

      - name: Mostrar detalles de pruebas fallidas
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_files = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          failure_count = 0
          for report in report_files:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  failure_count += 1
                  print(f"FAILED: {case.get('classname')} > {case.get('name')}")
                  print(f"Message: {problem.get('message', '(sin mensaje)')}")
                  detail = (problem.text or "").strip()
                  if detail:
                      print(detail[-4000:])
                  print("---")
          if failure_count == 0:
              print(f"No hay fallos XML de pruebas ({len(report_files)} informes revisados).")
          else:
              print(f"Total de pruebas fallidas: {failure_count}")
          PY

      - name: Compilar pruebas instrumentadas Android
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      # Only a direct push to this exact repository branch may use the stable key.
      # pull_request and workflow_dispatch executions use a temporary key instead.
      - name: Restaurar clave estable para una compilación candidata
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/archive-history-product-association-20261015' || github.ref == 'refs/heads/fix/backup-signature-compat-1.5.904')
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 en la configuración de GitHub Actions."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Clave estable validada."

      - name: Crear clave de depuración temporal
        if: github.event_name != 'push' || (github.ref != 'refs/heads/fix/archive-history-product-association-20261015' && github.ref != 'refs/heads/fix/backup-signature-compat-1.5.904')
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Compilar APK de prueba
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Candidate version: preserve Android backup rules and advance version numbering.
          # This targets installed 1.5.901/code 1901 -> 1.5.917/code 1917.
          # The stable certificate is used only by the guarded direct-push job above.
          VERSION_CODE=1917
          VERSION_NAME="1.5.917"
          echo "Building Mínimo ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          gradle :app:assembleDebug --stacktrace -PVERSION_CODE="${VERSION_CODE}" -PVERSION_NAME="${VERSION_NAME}"

      - name: Verificar firma y validez del APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK_PATH}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${APK_PATH}"
          sha256sum "${APK_PATH}"

      - name: Guardar APK de prueba durante 7 días
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimo-apk-candidato-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
