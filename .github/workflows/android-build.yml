name: Compilar Mínimo APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "tools/**"
      - ".gitignore"
      - "SECURITY.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimo-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Signing material is only available for trusted code on main, never pull-request branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el proyecto sin guardar credenciales Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'
          # Cache Robolectric's Android framework artifacts so transient Maven failures
          # do not make otherwise unrelated unit tests fail on a fresh runner.
          cache-read-only: false

      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        timeout-minutes: 15
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Mostrar resumen de pruebas fallidas sin volcar datos sensibles
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          failures = 0
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  failures += 1
                  message = (problem.get("message") or "Sin mensaje").replace("\\n", " ")[:1000]
                  print(f"FAILED: {case.get('classname')} > {case.get('name')}")
                  print(f"Message: {message}")
          if failures == 0:
              print(f"No se encontraron fallos XML en {len(reports)} informes de pruebas.")
          else:
              print(f"Pruebas fallidas: {failures}")
          PY

      - name: Compilar pruebas instrumentadas Android
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      # Only trusted main-branch builds can read the signing secret.
      - name: Restaurar clave de firma estable
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 en la configuración de GitHub Actions."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Clave estable encontrada y validada."

      - name: Compilar APK
        timeout-minutes: 20
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Stay above recovery APK versionCodes (4000+) so every main build is upgradeable.
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          # Main workflow run #3 follows the published 1.6.1021 recovery build.
          VERSION_NAME="1.6.$((1019 + GITHUB_RUN_NUMBER))"
          echo "Building Mínimo ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          gradle :app:assembleDebug --stacktrace -PVERSION_CODE="${VERSION_CODE}" -PVERSION_NAME="${VERSION_NAME}"

      - name: Verificar paquete, versión y firma del APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.6.$((1019 + GITHUB_RUN_NUMBER))"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -s "${APK_PATH}"
          BADGING="$("${AAPT}" dump badging "${APK_PATH}")"
          printf '%s\\n' "${BADGING}" | grep -F "package: name='com.aistudio.preciominimo.esrxvt' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${APK_PATH}"
          sha256sum "${APK_PATH}"

      - name: Guardar el APK durante 7 días
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
