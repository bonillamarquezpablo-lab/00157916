name: Compilar Mínimo APK

on:
  push:
    branches:
      - main
      - fix/wayback-cdx-recovery
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "tools/**"
      - ".gitignore"
      - "SECURITY.md"
      - ".github/dependabot.yml"
  workflow_dispatch:
    inputs:
      run_wayback_smoke:
        description: "Ejecutar una única comprobación en vivo contra Internet Archive"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: minimo-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep signed APK publication tied to the exact tested main revision.
jobs:
  build:
    # Signing material is only available for trusted code on main, never pull-request branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el proyecto sin guardar credenciales Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Escanear credenciales en archivos y en el historial
        run: python3 tools/secret_scan.py

      - name: Preparar Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'
          cache-read-only: false

      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        timeout-minutes: 15
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Mostrar resumen de pruebas fallidas sin volcar datos sensibles
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          failures = 0
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  failures += 1
                  message = (problem.get("message") or "Sin mensaje").replace("\\n", " ")[:1000]
                  print(f"FAILED: {case.get('classname')} > {case.get('name')}")
                  print(f"Message: {message}")
          if failures == 0:
              print(f"No se encontraron fallos XML en {len(reports)} informes de pruebas.")
          else:
              print(f"Pruebas fallidas: {failures}")
          PY

      - name: Sonda de recuperación real de histórico Wayback (solo ejecución manual opcional)
        if: github.event_name == 'workflow_dispatch' && inputs.run_wayback_smoke == true
        continue-on-error: true
        timeout-minutes: 2
        env:
          MINIMO_WAYBACK_LIVE_SMOKE: "1"
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --tests 'com.example.data.remote.WaybackPriceHistoryClientTest.liveWaybackLookupFindsVerifiedEurQuoteWhenEnabled' --stacktrace --info
          test_exit=$?
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          test_name = "liveWaybackLookupFindsVerifiedEurQuoteWhenEnabled"
          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          details = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.iter("testcase"):
                  if case.get("name") != test_name:
                      continue
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  status = "FAIL" if problem is not None else "PASS"
                  output = (case.findtext("system-out", "") or "").strip()
                  message = (problem.get("message") or "")[:1500] if problem is not None else ""
                  details.append(f"{status}: {output} {message}".strip())

          if not details:
              details.append("NO_XML_RESULT: inspect the Gradle log for the live Wayback probe.")
          for detail in details:
              print(detail)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Live Wayback historical-price probe\\n\\n")
              summary.write("\\n".join(details) + "\\n\\n")
          PY
          exit "$test_exit"

      - name: Compilar pruebas instrumentadas Android
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Restaurar clave de firma estable
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 en la configuración de GitHub Actions."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Clave estable encontrada y validada."

      - name: Calcular versión nueva a partir del APK publicado anteriormente
        id: version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # Unique version per workflow run AND retry. Run number is monotonic per workflow;
          # run_attempt prevents re-runs of the same run from reusing an APK version.
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="1.7.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          if [ "$VERSION_CODE" -le 6296 ]; then
            echo "::error::versionCode calculado ($VERSION_CODE) no supera la versión instalada 6296."
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Construyendo Mínimo $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Compilar APK
        timeout-minutes: 20
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          gradle :app:assembleSideload --stacktrace -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Verificar paquete, versión y firma del APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/sideload/app-sideload.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -s "$APK_PATH"
          BADGING="$("$AAPT" dump badging "$APK_PATH")"
          printf '%s\\n' "$BADGING" | grep -F "package: name='com.aistudio.preciominimo.esrxvt' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          MANIFEST_TREE="$("$AAPT" dump xmltree "$APK_PATH" AndroidManifest.xml)"
          if printf '%s\\n' "$MANIFEST_TREE" | grep -Eq 'android:debuggable.*(0xffffffff|true)'; then
            echo "::error::El APK de distribución directa contiene android:debuggable=true."
            exit 1
          fi
          echo "Manifest verificado: la aplicación no es depurable."
          SIGNATURE="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\\n' "$SIGNATURE"
          ACTUAL_CERT="$(printf '%s\\n' "$SIGNATURE" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="F631A8C0A194008E77A312A78775E95837DBC66DF635EAE9B966E5C294ADD450"
          if [ -z "$ACTUAL_CERT" ] || [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::La huella SHA-256 del certificado de firma no coincide con la clave estable autorizada."
            exit 1
          fi
          echo "Certificado de firma coincide con la huella estable autorizada."
          sha256sum "$APK_PATH"

      - name: Guardar el APK durante 7 días
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimo-apk
          path: app/build/outputs/apk/sideload/app-sideload.apk
          if-no-files-found: error
          retention-days: 7

  validate-wayback-fix:
    if: github.ref == 'refs/heads/fix/wayback-cdx-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout emergency fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          gradle-version: '9.8.1'
      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Run unit tests
        timeout-minutes: 15
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile Android instrumentation tests
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace
