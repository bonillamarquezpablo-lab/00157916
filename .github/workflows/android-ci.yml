name: Mínimo - comprobaciones de solicitudes de cambio

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "tools/**"
      - ".gitignore"
      - "SECURITY.md"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: minimo-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el proyecto sin guardar credenciales Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias
        timeout-minutes: 15
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Mostrar detalles de pruebas fallidas
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_files = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          failure_count = 0
          for report in report_files:
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  failure_count += 1
                  print(f"FAILED: {case.get('classname')} > {case.get('name')}")
                  print(f"Message: {problem.get('message', '(sin mensaje)')}")
                  detail = (problem.text or "").strip()
                  if detail:
                      print(detail[-4000:])
                  print("---")
          if failure_count == 0:
              print(f"No hay fallos XML de pruebas ({len(report_files)} informes revisados).")
          else:
              print(f"Total de pruebas fallidas: {failure_count}")
          PY

      - name: Compilar pruebas instrumentadas Android
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace
