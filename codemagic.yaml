workflows:
  android-apk:
    name: Minimo - APK Android gratuito
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Comprobar Gradle disponible
        script: |
          java -version
          gradle --version
      - name: Compilar APK debug
        script: |
          gradle --no-daemon --max-workers=2 assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/**/*.apk
